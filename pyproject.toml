[build-system]
requires = ["flit_core >= 3.12.0, <4"]
build-backend = "flit_core.buildapi"

[project]
name = "habitline"
version = "0.1.0"
authors = [
    { name = "Artem Novak", email = "artemnovak06@gmail.com" },
]
description = "A CLI tool for habit management, tracking, and analysis."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
]
[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-mock>=3.15.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest]
addopts = ["-ra", "-q", "--cov=habitline"]
testpaths = [
    "tests",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
]

[project.scripts]
habitline = "habitline.cli:cli"

[project.urls]
Homepage = "https://github.com/artynova/habitline"